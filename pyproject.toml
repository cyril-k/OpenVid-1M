[project]
name = "openvid-1m"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.2.1",
    "colossalai==0.4.6",
    "flash-attn>=2.7.2.post1",
    "ftfy>=6.3.1",
    "gdown>=5.2.0",
    "ipdb>=0.13.13",
    "ipykernel>=6.29.5",
    "mmengine>=0.10.5",
    "pandas>=2.2.3",
    "pyav>=14.0.1",
    "tensorboard>=2.18.0",
    "timm>=1.0.12",
    "torch==2.4.1",
    "torchcodec==0.0.3",
    "torchvision>=0.19.1",
    "wandb>=0.19.1",
    "xformers>=0.0.28.post1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "platform_system != 'Darwin'"},
]
torchvision = [
  { index = "pytorch-cu124", marker = "platform_system != 'Darwin'"},
]
xformers = [
  { index = "pytorch-cu124", marker = "platform_system != 'Darwin'"},
]

[tool.uv]
config-settings = { --build-option = "--cpp_ext --cuda_ext" }
